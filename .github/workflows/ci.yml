name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: build · lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # §19 R06 — stamp the date/build version (YYYY.M.D[.N]) into @stint/core before the build,
      # so the built artifacts and the GOLD version contract see a real version, not the dev
      # sentinel. STINT_BUILD_N is the same-day build counter: 1 + the number of release tags
      # already cut for today's date (so the first same-day release has no suffix, the second is
      # `.2`, etc.). On PR builds it is deterministic from the date alone (no tag lookup needed);
      # the actual publish/tag workflow that consumes the echoed version is §19 R05.
      - name: Stamp version (§19 R06)
        run: |
          today="$(date -u +%Y.%-m.%-d)"
          n="$(( $(git tag -l "${today}*" | wc -l) + 1 ))"
          STINT_BUILD_N="$n" npm run version:stamp
      - name: Build (core + cli + gui main)
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit · PROP · GOLD · BDD · integration
        run: npm test
      - name: No-network backstop (§17 R9)
        run: npm run verify:no-network
      # §19 R05 — static guard that every distributable electron-builder invocation keeps
      # `--publish never`. PR-time because the failure otherwise only shows post-merge
      # (process.html R02: verify before the gate).
      - name: Auto-publish guard (§19 R05)
        run: npm run verify:no-publish
      # §19 R01 — guard that electron-builder's native helper (app-builder-bin) is installed
      # AND runnable; a reinstall self-heals a missing/corrupt install (process.html R02/R04).
      # End-to-end proof is the pack-smoke job.
      - name: Packaging toolchain guard (§19 R01)
        run: |
          npm run verify:packaging || {
            echo "::warning::app-builder helper missing after npm ci — repairing (clean cache + reinstall)"
            npm cache clean --force
            rm -rf node_modules
            npm ci
            npm run verify:packaging
          }
      - name: Regenerate acceptance evidence
        run: npm run evidence
      # SLOC + documentation census. Fails the PR if a file escapes categorization or the
      # sums stop reconciling; the report ships as a build artifact, never committed
      # (process.html R10).
      - name: Codebase metrics — reconcile & render
        run: node scripts/sloc-report.mjs --out METRICS.md
      - name: Upload codebase metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codebase-metrics
          path: METRICS.md

  # §19 R01 — packaging smoke on every PR (process.html R02: the release matrix only runs
  # post-merge). Drives electron-builder for Linux to a packed app directory (`--dir`: fast,
  # but the SAME native helper + electron download + `files:` glob as the real pack). The
  # full AppImage/.deb artifacts + publish stay in release.yml.
  pack-smoke:
    name: pack-smoke · Linux (§19 R01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify packaging toolchain (app-builder-bin)
        run: |
          node scripts/check-packaging.mjs || {
            echo "::warning::app-builder helper missing after npm ci — repairing (clean cache + reinstall)"
            npm cache clean --force
            rm -rf node_modules
            npm ci
            node scripts/check-packaging.mjs
          }
      - name: Stamp version (§19 R06)
        run: |
          today="$(date -u +%Y.%-m.%-d)"
          n="$(( $(git tag -l "${today}*" | wc -l) + 1 ))"
          STINT_BUILD_N="$n" npm run version:stamp
      - name: Build (core + cli + gui main)
        run: npm run build
      - name: Pack GUI (Linux, unpacked dir — smoke)
        run: npm --workspace @stint/gui run pack:smoke
      - name: Assert a packed Linux app was produced
        run: |
          root=packages/gui/dist-pack/linux-unpacked
          if [ ! -d "$root" ]; then
            echo "no linux-unpacked dir under packages/gui/dist-pack/ — electron-builder --dir produced nothing"
            ls -R packages/gui/dist-pack 2>/dev/null || true
            exit 1
          fi
          # The app payload is asar-packed by default (resources/app.asar); tolerate a
          # non-asar build (resources/app/package.json) too. Either proves pack ran through.
          if [ ! -e "$root/resources/app.asar" ] && [ ! -e "$root/resources/app/package.json" ]; then
            echo "linux-unpacked produced but the app payload (resources/app.asar or resources/app/) is missing"
            ls -R "$root/resources" 2>/dev/null || true
            exit 1
          fi
          echo "packed Linux app present: $root"

  # §19 R01 — packaging smoke on macOS, the sibling of the Linux pack-smoke above (process.html
  # R02: the release matrix only runs post-merge — so a mac-only electron-builder breakage would
  # otherwise first surface as a red release, the founding incident's class). macos-latest runners
  # are free on this PUBLIC repo (only queue time). Drives electron-builder for macOS to an
  # unpacked `.app` (`--dir`: fast, but the SAME native helper + electron download + `files:` glob
  # + `.app` bundle assembly as the real pack). The full `.dmg` build + publish stay in release.yml.
  pack-smoke-mac:
    name: pack-smoke · macOS (§19 R01)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify packaging toolchain (app-builder-bin)
        run: |
          node scripts/check-packaging.mjs || {
            echo "::warning::app-builder helper missing after npm ci — repairing (clean cache + reinstall)"
            npm cache clean --force
            rm -rf node_modules
            npm ci
            node scripts/check-packaging.mjs
          }
      - name: Stamp version (§19 R06)
        run: |
          today="$(date -u +%Y.%-m.%-d)"
          n="$(( $(git tag -l "${today}*" | wc -l) + 1 ))"
          STINT_BUILD_N="$n" npm run version:stamp
      - name: Build (core + cli + gui main)
        run: npm run build
      # CSC_IDENTITY_AUTO_DISCOVERY=false keeps the unsigned mac build (electron-builder.yml
      # identity: null) from hunting for signing certs — no notarization/signing secrets on a
      # smoke, same as release.yml's pack job.
      - name: Pack GUI (macOS, unpacked dir — smoke)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm --workspace @stint/gui run pack:smoke:mac
      - name: Assert a packed macOS .app bundle was produced
        run: |
          # electron-builder --mac dir writes the unpacked bundle under
          # packages/gui/dist-pack/mac<-arch>/Stint.app — mac-arm64/ on the Apple-Silicon
          # macos-latest runner, mac/ on an x64 image. Tolerate either arch-suffixed dir.
          app="$(find packages/gui/dist-pack -maxdepth 2 -name 'Stint.app' -type d | head -n1)"
          if [ -z "$app" ]; then
            echo "no Stint.app under packages/gui/dist-pack/ — electron-builder --mac dir produced no .app bundle"
            ls -R packages/gui/dist-pack 2>/dev/null || true
            exit 1
          fi
          # The .app must carry the executable payload: Contents/Resources/app.asar (asar-packed,
          # the default) or Contents/Resources/app/package.json (non-asar). Either proves pack ran through.
          if [ ! -e "$app/Contents/Resources/app.asar" ] && [ ! -e "$app/Contents/Resources/app/package.json" ]; then
            echo ".app produced but the app payload (Contents/Resources/app.asar or app/) is missing"
            ls -R "$app/Contents/Resources" 2>/dev/null || true
            exit 1
          fi
          echo "packed macOS app present: $app"

  judge:
    name: JUDGE · GUI presentation (Chromium, headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run JUDGE harness (xvfb)
        run: xvfb-run -a npm run judge
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshots
          path: acceptance/evidence/screenshots/
