<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;"
    />
    <title>Stint</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- The single line-icon family — the SVG <symbol> sprite (design-system.html), embedded once
         so every <svg class="ic"><use href="#i-*"/></svg> across the renderer resolves and inherits
         currentColor. Lifted verbatim from context/mockups/design-system.html / util.js ICON_SPRITE. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 7h12M8 12h12M8 17h12M4 7h.01M4 12h.01M4 17h.01"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.6 19a5.4 5.4 0 0 1 10.8 0"/><path d="M16 5.6a3.1 3.1 0 0 1 0 5.8"/><path d="M16.6 13.4a5.4 5.4 0 0 1 3.8 5.6"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M7.5 20v-6M12 20v-10M16.5 20v-4"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2.2"/><circle cx="9" cy="16" r="2.2"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.2-4.2"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 6l10 6-10 6z"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2.2"/></symbol>
      <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 9h11l-3-3M17 15H6l3 3"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4l2.5 5 5.5.8-4 3.9.95 5.5L12 16.6 6.05 19.2 7 13.7l-4-3.9 5.5-.8z"/></symbol>
      <symbol id="i-cal" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2.2"/><path d="M4 9.5h16M9 3v4M15 3v4"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 21V4M6 4.5h11l-2.2 3.2L17 11H6"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.2A8 8 0 1 1 10.8 5a6.4 6.4 0 0 0 9.2 9.2z"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 11L12 15.5 16.5 11M5 20h14"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
      <symbol id="i-dots" viewBox="0 0 24 24"><path d="M6 12h.01M12 12h.01M18 12h.01"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></symbol>
      <symbol id="i-grip" viewBox="0 0 24 24"><path d="M9 7h.01M15 7h.01M9 12h.01M15 12h.01M9 17h.01M15 17h.01"/></symbol>
      <symbol id="i-restore" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 1 2.3 5.6M4 12V7M4 12h5"/></symbol>
      <symbol id="i-archive" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><path d="M10 12h4"/></symbol>
      <symbol id="i-split" viewBox="0 0 24 24"><path d="M4 12h16"/><path d="M12 4v5M12 15v5"/></symbol>
    </defs></svg>
    <div class="app">
      <div class="shell">
        <nav class="nav" aria-label="Views">
          <button type="button" class="nav-item" data-view="timer">
            <svg class="ic" aria-hidden="true"><use href="#i-clock" /></svg><span class="nav-label">Timer</span>
          </button>
          <button type="button" class="nav-item active" data-view="entries" aria-current="page">
            <svg class="ic" aria-hidden="true"><use href="#i-list" /></svg><span class="nav-label">Entries</span>
          </button>
          <button type="button" class="nav-item" data-view="clients">
            <svg class="ic" aria-hidden="true"><use href="#i-users" /></svg><span class="nav-label">Clients</span>
          </button>
          <button type="button" class="nav-item" data-view="reports">
            <svg class="ic" aria-hidden="true"><use href="#i-chart" /></svg><span class="nav-label">Reports</span>
          </button>
          <button type="button" class="nav-item" data-view="settings">
            <svg class="ic" aria-hidden="true"><use href="#i-settings" /></svg><span class="nav-label">Settings</span>
          </button>
        </nav>
        <div class="views">
          <section class="view" data-view="timer" hidden>
            <section class="timer-card idle" id="timer-card">
              <div class="tc-clock-block">
                <div class="clock tnum" id="timer-clock">00:00:00</div>
                <!-- design.html D05/A05: the running state is said in a word AND marked with a
                     dot, so it never rides on the recoloured count-up alone (issue #142). The
                     dot is decorative to assistive tech — #timer-state-word carries the state
                     in text, and #timer-state's own textContent is that word. -->
                <div class="state" id="timer-state"><span class="tc-dot" aria-hidden="true"></span><span id="timer-state-word">idle</span></div>
              </div>
              <div class="ctx">
                <div class="desc" id="timer-desc">nothing running</div>
                <div class="meta" id="timer-meta"></div>
                <div class="flags" id="timer-flags"></div>
              </div>
              <div class="btns">
                <!-- design.html D11: the Timer view's standing primary while a timer RUNS — the
                     idle face of the same standing action is #toggle below, and exactly one of the
                     two is ever on screen (§12 R05). Marked so the accent handoff reaches it too:
                     Stop + an open pin-as-favorite field would otherwise be two accent fills. -->
                <button class="primary" id="timer-stop" data-standing-primary hidden><svg class="ic" aria-hidden="true"><use href="#i-stop" /></svg>Stop</button>
              </div>
              <!-- §12 R21: a refused Stop/toggle is surfaced HERE, on the Timer view where the
                   action lives — the "Stop appears dead" surface (issue #61). Announced; cleared
                   on the next good write. The Entries-view #overlap-banner mirrors it for that
                   context, and the tray popover carries its own #pop-warning. -->
              <div id="timer-warning" class="form-error" role="status" aria-live="polite" hidden></div>
            </section>
            <section class="liveedit" id="live-edit" hidden aria-label="Edit the running timer">
              <div class="le-grid">
                <label class="le-field le-desc">Description
                  <input id="le-desc" type="text" autocomplete="off" />
                </label>
                <label class="le-field le-start">Start
                  <span class="range-field">
                    <!-- §05 R06 / §12 R14 (G1): a RAW text field (localInputValue format,
                         YYYY-MM-DD HH:mm:ss — the value the user retypes, so no `T` wire
                         separator, issue 159) — no native datetime-local popover. The calendar
                         affordance is a DISCLOSURE toggle over the in-flow start-only picker
                         host below (no modal, no backdrop); editing the open row can never
                         write an end. -->
                    <input id="le-start" type="text" autocomplete="off" spellcheck="false"
                           placeholder="YYYY-MM-DD HH:mm:ss" aria-label="Running timer start time" />
                    <button id="le-start-pick" type="button" class="range-pick-btn"
                            aria-expanded="false" aria-controls="le-start-disc"
                            aria-label="Adjust start on the day timeline"><svg class="ic" aria-hidden="true"><use href="#i-cal" /></svg></button>
                  </span>
                </label>
              </div>
              <!-- §05 R06: the in-flow host the inline START-ONLY picker expands into,
                   below the Start field. It renders the running block with a start grip
                   only, fading into the future — never an end control. -->
              <div id="le-start-disc" class="le-start-disc" hidden></div>
              <div class="le-row2">
                <label class="le-bill"><input id="le-bill" type="checkbox" /> Billable</label>
                <button type="button" id="le-tags" class="ghost small">Tags</button>
                <button type="button" id="le-project" class="ghost small">Client / project</button>
              </div>
            </section>
            <!-- §12 R05 (issue #51): the start panel is the IDLE-ONLY core-entry surface —
                 renderTimerCard hides it while a timer runs, so the running Timer view offers
                 only edit-or-stop of the open entry. The Billable box carries no static
                 `checked`: it defaults off the §05 R07 client-keyed rule (app.js syncs it to
                 the Client field until the user touches it, and an untouched box is omitted
                 from the payload so core derives the default). -->
            <section class="start-panel" id="start-panel">
              <div class="sp-actions">
                <!-- design.html D11: the Timer view's STANDING primary — the most-likely action
                     with nothing open. `data-standing-primary` is the marker app.js's
                     syncStandingPrimary reads: while an inline form is open (the Details form's own
                     Start, the Pin-as-favorite field's Pin) this one gives the `primary` class up
                     and paints as the D11 secondary, so the view never shows two accent fills —
                     and never two buttons reading "Start". -->
                <button class="primary" id="toggle" data-standing-primary aria-label="Start timer" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-play" /></svg>Start</button>
                <button id="start-toggle" class="ghost" aria-expanded="false" aria-controls="start-form">Details</button>
              </div>
              <!-- design.html D13 (issue 136): every field carries a VISIBLE label. These four were
                   named by their PLACEHOLDER alone, so the only name vanished on the first keystroke
                   and a screen reader read four unnamed text inputs. The wrapping label is the same
                   stacked idiom the live-edit strip above uses (.le-field) and the mockups draw as
                   `.lab` — and it is what keeps design.html §07's field-border exemption (A01), which
                   is CONDITIONED on the label being there. The placeholders go with it: a placeholder
                   repeating its own label is noise, not a hint. -->
              <form id="start-form" class="start-form" hidden>
                <label class="sp-field"><span>Description</span>
                  <input id="start-desc" type="text" autocomplete="off" /></label>
                <div class="start-row">
                  <label class="sp-field"><span>Client</span>
                    <input id="start-client" type="text" autocomplete="off" /></label>
                  <label class="sp-field"><span>Project</span>
                    <input id="start-project" type="text" autocomplete="off" /></label>
                </div>
                <label class="sp-field"><span>Tags</span>
                  <input id="start-tags" type="text" autocomplete="off" /></label>
                <label class="start-bill"><input id="start-bill" type="checkbox" /> Billable</label>
                <button id="start-go" type="submit" class="primary">Start</button>
              </form>
            </section>
            <section class="favorites" id="favorites">
              <header class="fav-head">
                <div class="fav-title">Favorites</div>
                <button type="button" id="fav-pin" class="fav-pin"><svg class="ic" aria-hidden="true"><use href="#i-star" /></svg>Pin</button>
              </header>
              <div class="fav-rail" id="fav-rail"></div>
              <div class="fav-empty" id="fav-empty" hidden>No favorites yet. Pin the running timer, or run <code>tt fav add</code>.</div>
            </section>
          </section>

          <!-- §12 R3: the Entries view -->
          <section class="view" data-view="entries">
            <header class="mast">
              <div class="wordmark">stint</div>
              <div class="summary" id="summary">— idle</div>
            </header>
            <button type="button" class="timer-strip idle" id="timer-strip" aria-label="Open the Timer view">
              <span class="strip-clock-block">
                <span class="strip-dot" aria-hidden="true"></span>
                <span class="clock tnum" id="strip-clock">00:00:00</span>
                <span class="state" id="strip-state">idle</span>
              </span>
              <span class="strip-desc" id="strip-desc">nothing running</span>
              <span class="strip-open">Open Timer<svg class="ic" aria-hidden="true"><use href="#i-right" /></svg></span>
            </button>
            <div id="overlap-banner" class="banner" hidden role="status" aria-live="polite"></div>
            <!-- §12 R09: the week-only Entries toolbar. LEFT — the prev/next-week steppers and
                 the week label (the week picker rail below owns week choice; these step it).
                 RIGHT (after the spacer) — the billable segment, client/project/tag filters,
                 search, and the Show-weekend toggle. There is NO range concept in this view: no
                 presets, no custom date pair (core and `tt list --range` keep arbitrary ranges —
                 week-only is GUI presentation), no range-total chip and no Reports shortcut
                 (issue #264; per-day billable totals live in the calendar's day headers, §12
                 R16). Adding an entry is NOT a toolbar affordance: the round + button lives on
                 the week grid itself (§12 R07, app.js renderCalendar), per mockup main.html. -->
            <!-- §12 R09/R16: the Entries HEAD BAND. The month-calendar week picker sits
                 ABOVE the grid, not beside it, sharing this band with the toolbar so the band's
                 width is spent rather than wasted — a 224px rail beside the grid cost every day
                 column 244px of the width it needs for description + client + range (issue #323).
                 Sharing the band with the toolbar is what keeps the vertical price down: the band
                 is as tall as the TALLER of the two, not the sum. The picker lives OUTSIDE the
                 repainted #entries host so a calendar repaint never rebuilds it mid-interaction. -->
            <div class="eband">
                <aside id="week-picker" class="wkpick" aria-label="Week picker"></aside>
              <div class="toolbar">
                <button type="button" id="el-prev-week" class="iconbtn" aria-label="Previous week"><svg class="ic" aria-hidden="true"><use href="#i-left" /></svg></button>
                <button type="button" id="el-next-week" class="iconbtn" aria-label="Next week"><svg class="ic" aria-hidden="true"><use href="#i-right" /></svg></button>
                <span class="wklabel" id="el-week-label"></span>
                <span class="sp"></span>

                <div class="seg" id="el-billable-seg" role="group" aria-label="Billable filter">
                  <button type="button" class="seg-btn on" data-billable="all" aria-pressed="true">All</button>
                  <button type="button" class="seg-btn" data-billable="billable" aria-pressed="false">Billable</button>
                  <button type="button" class="seg-btn" data-billable="non-billable" aria-pressed="false">Non-billable</button>
                </div>
                <!-- design.html D13 (issue 246): each filter carries a VISIBLE label — the same
                     wrapping idiom the Search field uses, and the shape mock main.html draws. -->
                <label class="filter-field"><span>Client</span>
                  <select id="el-client" class="report-field">
                    <option value="">All clients</option>
                  </select></label>
                <label class="filter-field"><span>Project</span>
                  <select id="el-project" class="report-field" disabled>
                    <option value="">All projects</option>
                  </select></label>
                <label class="filter-field"><span>Tag</span>
                  <input id="el-tag" class="report-field" type="text" autocomplete="off" /></label>

                <!-- design.html D13 (issue 136): the search box's only name was its placeholder plus an
                     invisible aria-label — D13 asks for a VISIBLE one, so the field chrome now sits
                     inside a label that says so on screen. The aria-label is gone with it: a visible
                     label IS the accessible name, and a second, different one only invites the two to
                     disagree (WCAG 2.5.3). -->
                <label class="search-field"><span class="search-lab">Search</span>
                  <span class="search">
                    <svg class="ic" aria-hidden="true"><use href="#i-search" /></svg>
                    <input type="search" id="search" autocomplete="off" />
                  </span>
                </label>

                <!-- §12 R09 / §14: the Show-weekend toggle at the toolbar's top right, driving the
                     PERSISTED show_weekend row over the same setSetting IPC the Settings view's
                     control edits — the two are one stored fact, so either surface flips both.
                     Off: the grid shows Monday–Friday; a hidden day's entries stay stored,
                     reported, and reachable by turning it on. -->
                <label class="wkend" for="el-weekend"><button type="button" id="el-weekend" class="sw" role="switch" aria-checked="false" aria-label="Show weekend"><i aria-hidden="true"></i></button> Show weekend</label>
              </div>
            </div>
            <!-- §06 R3 (design.html D11 / V5): the merge SELECTION BAR — above the calendar,
                 mock main.html's .selbar: the "N selected" raised-chip count pill, a flex
                 spacer, and a NEUTRAL Merge button. Merge never takes .primary: the Entries
                 view's one accent-solid primary is its standing Add entry, handed to the unified
                 form's Save entry (or the conflict prompt's Merge) while one is open. -->
            <div id="merge-bar" class="merge-bar" hidden>
              <span class="sel-count" id="merge-count"></span>
              <span class="cap"></span>
              <button id="merge-go" type="button" class="small"><svg class="ic" aria-hidden="true"><use href="#i-swap" /></svg>Merge</button>
            </div>
            <!-- §12 R06/R07 (G5): the ONE view-level host for the unified entry form. BOTH modes
                 mount here, in the view flow (no modal): app.js openUnifiedForm builds the one
                 reduced form (description · client · project · tags · billable · Start/Stop ·
                 Save/Cancel) for add and edit alike, in a quick upward expansion above the week
                 grid — the grid beneath is the drag surface that adjusts its interval (R16/R23).

                 It sits DIRECTLY above the grid, under the head band, which is R06's "above the
                 week grid" read literally: the form and the block it is editing are neighbours,
                 with nothing between the fields and the surface those fields draw on. It used to
                 sit above the toolbar instead, to keep Save inside the 1040×800 minimum window
                 without scrolling (§12 R22) — that constraint still binds and is still met here,
                 because the head band pairs the picker with the toolbar rather than stacking
                 them, so the form starts higher up the page than the old toolbar-plus-rail
                 stack would have put it. WINDOW_GEOMETRY's saveInViewport is what holds it. -->
            <div id="entry-form-host"></div>
            <!-- §12 R09/R16: the Entries body — the week grid, now spanning the FULL view
                 width (mockup main.html windows 1–3). The month calendar that used to sit to its
                 left moved into .eband above; see app.js renderWeekPicker for what it draws
                 (entry-dot days, today ring, the selected week as one lifted band, a roving grid
                 keyboard path; NO live-timer treatment). -->
            <div class="ebody">
              <main id="entries"></main>
            </div>
          </section>

          <!-- §07/§12: the Clients view -->
          <section id="clients" class="view clients" data-view="clients" hidden>
            <div class="clients-head vhead">
              <h2 class="clients-title vtitle">Clients</h2>
              <span class="clients-head-actions">
                <!-- §12 R13: reveal archived records (with Restore) — parity with `tt … ls --archived`. -->
                <button id="show-archived" type="button" class="small ghost" aria-pressed="false">Show archived</button>
                <!-- design.html D11: the Clients view's STANDING primary, handed to whichever
                     inline field is open (a rename's Save, a client/project/tag add's Add). -->
                <button id="add-client-btn" type="button" class="small primary" data-standing-primary><svg class="ic" aria-hidden="true"><use href="#i-plus" /></svg>Add client</button>
              </span>
            </div>
            <div id="clients-list" class="clients-list"></div>

            <div class="tags-head vhead">
              <h2 class="clients-title vtitle">Tags</h2>
              <!-- design.html D11: Add tag is NEUTRAL (mock clients.html `.btn sm`) — the
                   Clients view's one accent-solid primary is its standing + Add client. -->
              <button id="add-tag" type="button" class="small"><svg class="ic" aria-hidden="true"><use href="#i-plus" /></svg>Add tag</button>
            </div>
            <div id="tags-list" class="tags-list"></div>
          </section>

          <!-- §12 R08: the Reports view -->
          <section class="view reports-view" data-view="reports" hidden>
            <div class="reports-head vhead">
              <h2 class="reports-title vtitle">Saved reports</h2>
              <!-- design.html D11: the Reports view's STANDING primary. Opening the builder is the
                   most-likely action at rest, but it only OPENS a form — so once the builder is up
                   the accent moves to #rep-save, which commits, and this reverts to secondary. -->
              <button type="button" id="rep-new" class="primary" data-standing-primary><svg class="ic" aria-hidden="true"><use href="#i-plus" /></svg>New report</button>
            </div>

            <!-- §12 R08: the saved-definition ACCORDION. reports.js paints one .def card per
                 saved report (head row + an empty .def-body expansion host); the builder and
                 the run-output below are SINGLE view-level elements that move — expanding a
                 card adopts them into its .def-body, so "exactly one card expanded at a time"
                 is structural. Collapsing discards results (a re-view costs a re-run). -->
            <div class="defs" id="rep-defs"></div>
            <div class="defs-empty" id="rep-defs-empty" hidden>No saved reports yet.</div>

            <!-- §09 R08 / §12 R08: the ONE inline builder. This slot is its parked home and the
                 spot where a New report opens (below the list — a fresh def has no card yet);
                 Edit adopts it into the edited card's .def-body, the same nested pattern the
                 run-output follows. -->
            <form class="builder" id="rep-builder" hidden>
              <div class="builder-head">
                <h3 class="builder-title" id="rep-builder-title">New report</h3>
                <!-- design.html D13 (issue 136): the name field was named by placeholder + an
                     invisible aria-label. The stacked visible label mirrors reports.html's own
                     `.en` block, which has drawn "Report name" above the field all along. -->
                <label class="builder-name-field"><span>Report name</span>
                  <input id="rep-name" class="builder-name" type="text" autocomplete="off" /></label>
              </div>

              <div class="report-ctrl">
                <span class="report-lab">Range</span>
                <div class="report-row">
                  <div class="seg presets" id="rep-preset-seg" role="group" aria-label="Date range">
                    <button type="button" class="preset" data-preset="today">Today</button>
                    <button type="button" class="preset on" data-preset="week" aria-pressed="true">This week</button>
                    <button type="button" class="preset" data-preset="last-week">Last week</button>
                    <button type="button" class="preset" data-preset="month">This month</button>
                    <button type="button" class="preset" data-preset="last-month">Last month</button>
                    <button type="button" class="preset" data-preset="custom">Custom…</button>
                  </div>
                </div>
                <!-- §09 R01 (G3): the builder's custom range is a pair of PLAIN DATES, no
                     time component — the raw values travel in the saved rangeSpec and main
                     resolves them to the inclusive-end-day local window in core-side code. -->
                <div class="custom-range" id="rep-custom-range" hidden>
                  <label class="report-lab" for="rep-range-from">From</label>
                  <input id="rep-range-from" class="report-field" type="date" aria-label="Range from" />
                  <label class="report-lab" for="rep-range-to">To</label>
                  <input id="rep-range-to" class="report-field" type="date" aria-label="Range to" />
                </div>

                <span class="report-lab">Group by</span>
                <div class="report-row">
                  <div class="seg" id="rep-by-seg" role="group" aria-label="Group by">
                    <button type="button" class="seg-btn on" data-by="client">Client</button>
                    <button type="button" class="seg-btn" data-by="project">Project</button>
                    <button type="button" class="seg-btn" data-by="day">Day</button>
                    <button type="button" class="seg-btn" data-by="week">Week</button>
                    <button type="button" class="seg-btn" data-by="month">Month</button>
                    <button type="button" class="seg-btn" data-by="tag">Tag</button>
                  </div>
                </div>

                <!-- design.html D13 (issue 246): "Filters" heads THREE controls, so it is a GROUP
                     label and names none of them — a control's only visible word is never a
                     category nor a sibling's name. Each control takes its own visible name, in the
                     same wrapping idiom AND the same words as the Entries toolbar's filters: one
                     vocabulary per control across both surfaces. The `aria-label`s go with them,
                     and so does #rep-tag's placeholder — a visible label IS the accessible name,
                     and a second, different one only invites the two to disagree (WCAG 2.5.3),
                     which is the visible-word/spoken-word split this row was filed for. -->
                <span class="report-lab">Filters</span>
                <div class="report-row">
                  <label class="filter-field"><span>Client</span>
                    <select id="rep-client" class="report-field">
                      <option value="">All clients</option>
                    </select></label>
                  <label class="filter-field"><span>Project</span>
                    <select id="rep-project" class="report-field" disabled>
                      <option value="">All projects</option>
                    </select></label>
                  <label class="filter-field"><span>Tag</span>
                    <input id="rep-tag" class="report-field" type="text" autocomplete="off" /></label>
                </div>

                <span class="report-lab">Billable</span>
                <div class="report-row">
                  <div class="seg" id="rep-billable-seg" role="group" aria-label="Billable filter">
                    <button type="button" class="seg-btn on" data-billable="billable" aria-pressed="true">Billable</button>
                    <button type="button" class="seg-btn" data-billable="all" aria-pressed="false">All</button>
                    <button type="button" class="seg-btn" data-billable="non-billable" aria-pressed="false">Non-billable</button>
                  </div>
                </div>

                <!-- design.html D13 (issue 246): the same rule reaches this row. "Rounding" heads
                     TWO controls — the on/off toggle and the increment picker — so it is a group
                     label here too. The toggle is named by its own words; the picker was named by
                     the heading alone, so it takes the row's word for the thing it sets. Range,
                     Group by and Billable each head ONE control, which is a group label naming
                     the group it labels, and the rule permits that. -->
                <span class="report-lab">Rounding</span>
                <div class="report-row">
                  <label class="report-toggle">
                    <input id="rep-rounding" type="checkbox" />
                    Round grouped totals
                  </label>
                  <label class="filter-field"><span>Increment</span>
                    <select id="rep-rounding-increment" class="report-field">
                      <option value="15">nearest 15 min</option>
                      <option value="6">nearest 6 min</option>
                      <option value="10">nearest 10 min</option>
                      <option value="30">nearest 30 min</option>
                    </select></label>
                </div>
              </div>

              <!-- §12 R21: a refused Save is surfaced here, at the point of action — an
                   incomplete custom range (focus the missing field) or a core rejection
                   (duplicate name). Announced (role=status/aria-live); the message persists
                   until the next input on the builder, never a same-tick self-erase. -->
              <div id="rep-warning" class="form-error" role="status" aria-live="polite" hidden></div>
              <div class="builder-foot">
                <button type="button" id="rep-cancel" class="report-export-btn">Cancel</button>
                <button type="button" id="rep-delete" class="report-export-btn" hidden>Delete</button>
                <!-- design.html D11: Save is the builder's commit, so it carries the Reports view's
                     one accent-solid fill while the builder is open — the accent used to sit on the
                     button that merely opened this form while the commit read as neutral chrome. -->
                <button type="submit" id="rep-save" class="primary">Save</button>
              </div>
            </form>

            <!-- §12 R08: the run-output. Parked here hidden; a run adopts it (with the filtered
                 export row below) into the ran card's .def-body, so the results are visually
                 scoped to the report that produced them (issue #268). The close control
                 collapses the card and DISCARDS the results. -->
            <div class="report-summary" id="rep-run" hidden>
              <div class="report-head">
                <span id="rep-run-caption">Run</span>
                <span class="report-head-total">Total <b id="rep-run-total" class="tnum">0h 00m</b></span>
                <button type="button" id="rep-run-close" class="iconbtn" aria-label="Collapse this report's results"><svg class="ic" aria-hidden="true"><use href="#i-x" /></svg></button>
              </div>
              <div class="report-range" id="rep-run-range"></div>
              <table class="report-table">
                <thead>
                  <tr>
                    <th>Group</th>
                    <th class="num">Billable</th>
                  </tr>
                </thead>
                <tbody id="rep-run-rows"></tbody>
                <tfoot>
                  <tr class="report-tot">
                    <td>Total</td>
                    <td class="num tnum" id="rep-run-grand">0h 00m</td>
                  </tr>
                </tfoot>
              </table>
            </div>
            <!-- §09 R06/R09: the report's OWN export — the FILTERED rows it shows (its range
                 narrowed by the def's client/project/tag + billable filter), byte-identical to
                 `tt report run <name> --csv|--json`. Lives INSIDE the expanded card with the
                 run-output it exports (the nesting states the scope, so no label names it);
                 hidden until a run paints rows for it to export. -->
            <div class="report-export" id="rep-run-export" hidden>
              <button type="button" id="rep-export-csv" class="report-export-btn">Export CSV</button>
              <button type="button" id="rep-export-json" class="report-export-btn">Export JSON</button>
              <span id="rep-export-status" class="report-export-status" role="status" aria-live="polite"></span>
            </div>
            <!-- §09 R06: the raw data-out escape hatch, set apart at the BOTTOM of the view —
                 VIEW-LEVEL, never inside a card, distinct from the in-card filtered export —
                 the WHOLE RECORD, every raw entry ever (billable AND non-billable, no range),
                 byte-identical to no-flag `tt export`. Standing chrome: always visible, always
                 clickable, no run required (it is run-independent, so it stays outside the
                 accordion). -->
            <div class="report-export report-export-all" id="rep-run-export-all">
              <span class="report-export-scope">All data</span>
              <button type="button" id="rep-export-all-csv" class="report-export-btn ghost">Export All Data (CSV)</button>
              <button type="button" id="rep-export-all-json" class="report-export-btn ghost">Export All Data (JSON)</button>
              <span id="rep-export-all-status" class="report-export-status" role="status" aria-live="polite"></span>
            </div>
          </section>

          <!-- §12 R11: the Settings view -->
          <section class="view settings-view" data-view="settings" hidden>
            <div class="settings-head vhead">
              <h2 class="settings-title vtitle">Settings</h2>
            </div>
            <div id="settings-panel" class="settings-panel"></div>
            <div id="software-update" class="settings-panel"></div>
            <!-- §20 R04/R05: the Backups group (restore list + retention) and the one-shot
                 corruption-recovery banner; rendered by settings.js off the getState snapshot. -->
            <div id="backups-panel" class="settings-panel"></div>
            <!-- §12 R25 / §13: the file-backed Storage group beside Backups — the Database /
                 Backup-folder rows with effective path + source (agreeing with tt paths over
                 the getStoragePaths channel) and the §12 R26 change dialog's launchers;
                 rendered by settings.js (mockups: settings.html, storage-change.html). -->
            <div id="storage-panel" class="settings-panel"></div>
          </section>
        </div>
      </div>
    </div>
    <script src="dist/su.js"></script>
    <script src="timepicker.js"></script>
    <script src="app.js"></script>
    <script src="reports.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
