<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stint — Clients</title>
<style>
/* STINT-TOKENS start — generated from context/design.tokens.json; do not edit by hand */
:root{
  --paper:#fdfdfc;--sidebar:#f9f9f8;--wash:#f1f0ef;--hover:#e9e8e6;--canvas:#e2e1de;
  --rule:#dad9d6;--rule-strong:#bcbbb5;--faint:#8d8d86;--muted:#63635e;--ink:#21201c;
  --accent:#e54d2e;--accent-solid:#d13415;--accent-ink:#d13415;--accent-weak:#feebe7;
  --run:#2a7e3b;--run-dot:#46a758;--run-weak:#e9f6e9;
  --flag:#4f3422;--flag-bg:#fff7c2;--flag-line:#f3d673;
  --danger:#ce2c31;--danger-weak:#feebec;
  --r1:8px;--r2:12px;--r3:16px;
  --ring:0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent);
  --sh-chip:0 1px 2px rgba(74,52,24,.12);
  --sh-card:0 4px 16px rgba(74,52,24,.07), 0 1px 2px rgba(74,52,24,.05);
  --sh-raise:0 8px 24px rgba(74,52,24,.10), 0 1px 3px rgba(74,52,24,.06);
  --sh-pop:0 16px 44px rgba(60,42,18,.20), 0 2px 6px rgba(60,42,18,.10);
  --sh-modal:0 28px 70px rgba(50,34,14,.30), 0 3px 10px rgba(50,34,14,.14);
  --sh-win:0 30px 80px rgba(50,34,14,.22);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI","Helvetica Neue",system-ui,sans-serif;
  --num:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
}
/* STINT-TOKENS end */
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .ic{width:16px;height:16px;display:inline-block;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
  /* window chrome */
  .win{max-width:1040px;margin:32px auto 8px;background:var(--paper);border-radius:var(--r3);overflow:hidden;box-shadow:var(--sh-win);border:1px solid var(--rule-strong)}
  .bar{height:42px;display:flex;align-items:center;background:#F1EBE0;border-bottom:1px solid var(--rule);position:relative}
  .lights{display:flex;gap:8px;padding-left:16px}.lights i{width:12px;height:12px;border-radius:50%;display:block}
  .lights .r{background:#e8795f}.lights .y{background:#e7b34e}.lights .g{background:#7fae6a}
  .bar .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);font-weight:590;pointer-events:none}
  .prov{max-width:1040px;margin:0 auto 32px;text-align:center;font-size:11px;color:var(--faint);padding:4px 16px}
  /* shell + sidebar */
  .shell{display:flex;min-height:600px}
  .nav{width:168px;flex:none;background:var(--sidebar);border-right:1px solid var(--rule);padding:16px 12px;display:flex;flex-direction:column;gap:2px}
  .nav a{display:flex;align-items:center;gap:12px;height:38px;padding:0 12px;border-radius:var(--r1);color:var(--ink);text-decoration:none;font-weight:500}
  .nav a .ic{color:var(--muted)}
  .nav a:hover{background:var(--hover)}
  /* D12/V7: selection ≠ accent — the active nav item lifts as a raised paper chip;
     only its icon takes accent, the label stays ink. */
  .nav a.on{background:var(--paper);box-shadow:var(--sh-chip);font-weight:590;color:var(--ink)}
  .nav a.on .ic{color:var(--accent)}
  .nav .sp{flex:1}
  /* view */
  .view{flex:1;min-width:0;display:flex;flex-direction:column;padding:24px 28px}
  .vhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .vtitle{font-size:18px;font-weight:640;margin:0;letter-spacing:-.01em}
  /* buttons */
  .btn{font:inherit;font-weight:590;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 16px;border-radius:var(--r1);border:1px solid var(--rule-strong);background:var(--paper);color:var(--ink);cursor:pointer;white-space:nowrap;transition:background .12s,box-shadow .12s}
  .btn:hover{background:var(--hover)}
  .btn .ic{width:15px;height:15px;color:var(--muted)}
  .btn.primary{background:var(--accent-solid);border-color:var(--accent-solid);color:#fff;box-shadow:0 1px 2px color-mix(in srgb, var(--accent) 35%, transparent)}
  .btn.primary:hover{background:color-mix(in srgb, var(--accent-solid) 88%, black)}
  .btn.primary .ic{color:#fff}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
  .btn.ghost:hover{background:var(--hover);color:var(--ink)}
  .btn.danger{color:var(--danger);border-color:transparent;background:transparent}
  .btn.danger:hover{background:var(--danger-weak)}
  .btn.sm{height:30px;padding:0 12px;font-size:12px}
  .iconbtn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:var(--r1);border:0;background:none;color:var(--muted);cursor:pointer}
  .iconbtn:hover{background:var(--hover);color:var(--ink)}
  /* segmented */
  .seg{display:inline-flex;background:var(--wash);border:1px solid var(--rule);border-radius:var(--r1);padding:4px;gap:4px}
  .seg button{font:inherit;font-size:12px;border:0;background:none;color:var(--muted);height:26px;padding:0 12px;border-radius:var(--r1);cursor:pointer;white-space:nowrap}
  .seg button:hover{color:var(--ink)}
  .seg button.on{background:var(--paper);color:var(--ink);font-weight:590;box-shadow:var(--sh-chip)}
  /* toggle */
  .toggle{display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
  .sw{width:36px;height:21px;border-radius:999px;background:var(--rule-strong);position:relative;flex:none;cursor:pointer;transition:background .12s}
  .sw i{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(74,52,24,.25);transition:left .12s}
  .sw.on{background:var(--accent)}.sw.on i{left:17px}
  /* fields */
  .lab{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .field{font:inherit;width:100%;background:var(--paper);border:1px solid var(--rule-strong);border-radius:var(--r1);padding:8px 12px;color:var(--ink)}
  .field:focus{outline:2px solid var(--accent);outline-offset:2px;border-color:var(--accent);box-shadow:var(--ring)}
  textarea.field{resize:vertical;min-height:42px}
  select.field{width:auto;min-width:150px}
  /* card / tag / pill */
  .card{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r2);box-shadow:var(--sh-card)}
  .tag{font-size:11.5px;color:var(--muted);background:var(--wash);border:1px solid var(--rule);border-radius:999px;padding:2px 8px;display:inline-flex;align-items:center;gap:4px}
  .tag b{color:var(--muted);cursor:pointer;font-weight:400}
  .pill{font-size:11px;border-radius:999px;padding:2px 8px;border:1px solid var(--rule-strong);color:var(--muted);background:var(--wash);white-space:nowrap}
  .pill.run{color:var(--run);background:var(--run-weak);border-color:color-mix(in srgb, var(--run) 30%, transparent)}
  .pill.warn{color:var(--flag);background:var(--flag-bg);border-color:var(--flag-line)}
  .pill.accent{color:var(--accent-ink);background:var(--paper);border-color:color-mix(in srgb, var(--accent) 30%, transparent)}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}.dot.run{background:var(--run-dot)}
  .meta{color:var(--muted)}.cap{font-size:12px;color:var(--muted)}

  /* clients view */
  .view{gap:24px}
  .sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .sec-h h3{font-size:14px;font-weight:640;margin:0}
  .sec-h .cap{margin-left:8px;font-weight:400}
  .clist{display:flex;flex-direction:column;gap:12px}
  .cl{padding:4px}
  .cl-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r1)}
  .cl-row:hover{background:var(--wash)}
  .cl-row .nm{font-weight:590;font-size:13.5px}
  .cl-row.client .nm{font-size:14px;font-weight:640}
  .cl-row .acts{margin-left:auto;display:flex;gap:4px;align-items:center}
  .cl-row .count{color:var(--muted);font-size:11.5px;margin-left:2px}
  .proj{position:relative;margin-left:16px;padding-left:16px;border-left:2px solid var(--rule-strong)}
  .proj .cl-row{padding:8px 12px}
  .proj .cl-row .nm{font-weight:500;color:var(--ink)}
  .proj-add{display:inline-flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;font:inherit;font-size:13px;font-weight:500;color:var(--muted);padding:8px 12px}
  .proj-add .ic{width:15px;height:15px;color:var(--muted)}
  .proj-add:hover{color:var(--ink)}
  .cl.arch .cl-row.client .nm{color:var(--muted)}
  .empty{color:var(--muted);font-size:12px;padding:8px 12px}
  .taglist{display:flex;flex-direction:column}
  .tg-row{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:var(--r1)}
  .tg-row:hover{background:var(--wash)}
  .tg-row + .tg-row{border-top:1px solid var(--rule)}
  .tg-row .acts{margin-left:auto;display:flex;gap:4px;align-items:center}
</style>
</head>
