<!--
  The running tray glyph — the two bars fused into one unbroken block.

  The state reads as SHAPE, not hue: one event still open versus one finished and one
  waiting. That is what lets the running state survive a macOS template image (which
  discards colour outright) and satisfies design.html A05 — colour is never the only
  signal (design.html D19).

  Its bounding box is identical to glyph-idle.svg's — both blocks span y 4→20.

  Fills come from CLASSES, never attributes (design.html D18); see mark.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <rect class="bar-strong" x="3" y="4" width="18" height="16" rx="2.25"/>
</svg>
